name: Install Estudio AudioVisual V2
on:
  push:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract files into repository root
        run: |
          unzip -o 'Estudio-AudioVisual-V2(1).zip' -d .
          rm -f 'Estudio-AudioVisual-V2(1).zip'
          rm -f '.github/workflows/unpack-upload.yml'
      - name: Commit extracted project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Instalează Estudio AudioVisual V2'
          git push
